<line x1="318" y1="402" x2="284" y2="402" stroke="#7c2d12" stroke-width="2" marker-end="url(#arr)"/>
<text x="300" y="424" text-anchor="middle" font-size="12" font-weight="bold">Devisa</text>
<text x="300" y="462" text-anchor="middle" font-size="12" fill="#4b5563">Panah menunjukkan arah aliran antara keempat sektor.</text>
</g>
