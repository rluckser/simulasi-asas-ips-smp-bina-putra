<line x1="250" y1="360" x2="250" y2="280" stroke="#92400e" stroke-width="2" marker-end="url(#arr)"/>
<text x="240" y="325" text-anchor="end" font-size="12" font-weight="bold">Subsidi</text>
<text x="300" y="468" text-anchor="middle" font-size="12" fill="#4b5563">Panah menunjukkan arah aliran antara keempat sektor.</text>
