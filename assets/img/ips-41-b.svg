<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480" role="img">
<title>Siklus ekonomi 4 sektor — varian B</title>
<rect x="0" y="0" width="600" height="480" fill="#ffffff"/>
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c2d12"/></marker>
<marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1d4ed8"/></marker>
</defs>
<g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2a37">
<text x="300" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c2d12">Siklus Ekonomi 4 Sektor</text>
<rect x="200" y="40" width="200" height="76" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2"/>
<text x="300" y="70" text-anchor="middle" font-weight="bold" font-size="14">Rumah Tangga Konsumen</text>
<text x="300" y="92" text-anchor="middle" font-size="12">Faktor produksi — Balas jasa</text>
<rect x="390" y="190" width="190" height="76" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="485" y="220" text-anchor="middle" font-weight="bold" font-size="14">Rumah Tangga Produsen</text>
<text x="485" y="242" text-anchor="middle" font-size="12">(Perusahaan)</text>
<rect x="200" y="364" width="200" height="76" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="2"/>
<text x="300" y="394" text-anchor="middle" font-weight="bold" font-size="14">Pemerintah</text>
